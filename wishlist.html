<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes favoris — KOLCH HNA</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FFFFFF; --surface:#FFFFFF; --text:#191919; --muted:#737373;
      --border:#E7E7E2; --dark:#111111; --lime:#D7FF00; --subtle:#F0F0EC; --warm:#F7F7F4;
      --lime-ring:rgba(215,255,0,.45);
      --r-xs:4px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px;
      --shadow:0 1px 2px rgba(25,25,25,.04);
      --container:1200px;
      --font-display:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
      --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
      color-scheme: light;
    }
    [data-theme="dark"]{
      --bg:#0F0F0E; --surface:#151513; --text:#F5F5F4; --muted:#A1A1A0;
      --border:#2A2A28; --dark:#111111; --lime:#D7FF00; --subtle:#1F1F1D; --warm:#1A1A18;
      --lime-ring:rgba(215,255,0,.35);
      --shadow:0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#0F0F0E; --surface:#151513; --text:#F5F5F4; --muted:#A1A1A0;
        --border:#2A2A28; --dark:#111111; --lime:#D7FF00; --subtle:#1F1F1D; --warm:#1A1A18;
        --lime-ring:rgba(215,255,0,.35);
        --shadow:0 1px 2px rgba(0,0,0,.4);
        color-scheme: dark;
      }
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    :focus-visible{outline:2px solid var(--dark);outline-offset:2px;box-shadow:0 0 0 4px var(--lime-ring)}
    h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.025em}
    .container{width:min(calc(100% - 40px),var(--container));margin-inline:auto}
    .site-header{position:sticky;top:0;z-index:60;background:var(--surface)}
    .masthead{background:var(--surface);border-bottom:1px solid var(--border)}
    .masthead-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
    .brand{display:inline-flex;align-items:baseline;gap:10px}
    .brand-word{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.04em;text-transform:uppercase}
    .brand-accent{display:inline-flex;padding:1px 4px;border-radius:2px;background:var(--lime);color:var(--dark)}
    .header-actions{display:flex;align-items:center;gap:8px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-sm);font-size:14px;font-weight:600}
    .btn-sm{height:38px;padding:0 14px;font-size:13px}
    .btn-primary{background:var(--lime);color:var(--dark)}
    .btn-primary:hover{background:var(--dark);color:var(--lime)}
    .btn-outline{background:transparent;border:1px solid var(--border)}
    .btn-outline:hover{border-color:var(--lime);color:var(--dark);background:var(--lime)}
    .breadcrumb{display:flex;align-items:center;gap:8px;padding-top:18px;font-size:13px;color:var(--muted)}
    .breadcrumb a:hover{color:var(--text)}
    .breadcrumb-sep{color:#C9C9C4}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:14px 18px}
    .page-title{font-size:clamp(1.6rem,1.2rem + 2vw,2.6rem);letter-spacing:-.045em}
    .grid-products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:stretch;padding-bottom:64px}
    .product-card{display:flex;flex-direction:column;height:100%;border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;background:var(--surface);transition:border-color .15s}
    .product-card:hover{border-color:#D5D5CE}
    .product-card-media{position:relative;aspect-ratio:4/3;background:var(--subtle);overflow:hidden;border-radius:var(--r-xl) var(--r-xl) 0 0}
    .product-card-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
    .product-card:hover .product-card-media img{transform:scale(1.04)}
    .product-card-body{display:flex;flex-direction:column;flex:1;gap:6px;padding:14px 14px 12px;min-height:0}
    .product-card-cat{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .product-card-title{font-size:14px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(1.45em * 2)}
    .product-card-title a{color:inherit}
    .product-card-price{font-weight:600}
    .product-card-footer{margin-top:auto;display:grid;gap:10px;padding-top:12px}
    .product-card-footer .btn{width:100%;height:38px}
    @media(max-width:1180px){.grid-products{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:980px){.grid-products{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:640px){
      .container{width:min(calc(100% - 24px),var(--container))}
      .masthead-inner{height:64px}
      .page-head{flex-direction:column;align-items:flex-start}
      .grid-products{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <div class="container masthead-inner">
        <a class="brand" href="index.html">
          <span class="brand-word">KOLCH <span class="brand-accent">HNA</span></span>
        </a>
        <div class="header-actions">
          <a class="btn btn-outline btn-sm" href="cart.html">Panier</a>
          <a class="btn btn-outline btn-sm" href="wishlist.html">Mes favoris</a>
          <a class="btn btn-outline btn-sm" href="login.html">Se connecter</a>
          <a class="btn btn-primary btn-sm" href="signup.html">S'inscrire</a>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html">Accueil</a>
        <span class="breadcrumb-sep">/</span>
        <span>Mes favoris</span>
      </nav>
      <div class="page-head">
        <div>
          <h1 class="page-title">Mes favoris</h1>
          <p style="margin-top:6px;color:var(--muted)">Produits enregistrés pour plus tard</p>
        </div>
        <a class="btn btn-outline btn-sm" href="products.html">Continuer mes achats</a>
      </div>
      <div class="grid-products">
        <article class="product-card">
          <a class="product-card-media" href="product.html">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1160&auto=format&fit=crop" alt="Smartphone">
          </a>
          <div class="product-card-body">
            <span class="product-card-cat">Électronique</span>
            <h3 class="product-card-title"><a href="product.html">Smartphone 5G 128GB — Écran AMOLED</a></h3>
            <span class="product-card-price">34 900 DZD</span>
            <div class="product-card-footer">
              <button class="btn btn-primary btn-sm">Ajouter au panier</button>
              <button class="btn btn-outline btn-sm">Retirer des favoris</button>
            </div>
          </div>
        </article>
        <article class="product-card">
          <a class="product-card-media" href="product.html">
            <img src="https://images.unsplash.com/photo-1520923642038-b4259acecbd7?q=80&w=1119&auto=format&fit=crop" alt="Écouteurs">
          </a>
          <div class="product-card-body">
            <span class="product-card-cat">Électronique</span>
            <h3 class="product-card-title"><a href="product.html">Écouteurs sans fil Bluetooth</a></h3>
            <span class="product-card-price">6 900 DZD</span>
            <div class="product-card-footer">
              <button class="btn btn-primary btn-sm">Ajouter au panier</button>
              <button class="btn btn-outline btn-sm">Retirer des favoris</button>
            </div>
          </div>
        </article>
      </div>
    </div>
  </main>
</body>
</html>
