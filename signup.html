<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription — KOLCH HNA</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FFFFFF; --surface:#FFFFFF; --text:#191919; --muted:#737373;
      --border:#E7E7E2; --dark:#111111; --lime:#D7FF00; --subtle:#F0F0EC; --warm:#F7F7F4;
      --muted-strong:#66665F; --muted-dark:#B9B9B4; --border-dark:#3A3A38;
      --lime-ring:rgba(215,255,0,.45); --placeholder:#6E6E68;
      --r-xs:4px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px;
      --shadow:0 1px 2px rgba(25,25,25,.04);
      --container:1080px; --pad:24px;
      --font-display:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
      --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
      color-scheme: light;
    }
    [data-theme="dark"]{
      --bg:#0F0F0E; --surface:#151513; --text:#F5F5F4; --muted:#A1A1A0;
      --border:#2A2A28; --dark:#111111; --lime:#D7FF00; --subtle:#1F1F1D; --warm:#1A1A18;
      --muted-strong:#B9B9B4; --muted-dark:#6E6E68; --border-dark:#3A3A38;
      --lime-ring:rgba(215,255,0,.35); --placeholder:#6E6E68;
      --shadow:0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#0F0F0E; --surface:#151513; --text:#F5F5F4; --muted:#A1A1A0;
        --border:#2A2A28; --dark:#111111; --lime:#D7FF00; --subtle:#1F1F1D; --warm:#1A1A18;
        --muted-strong:#B9B9B4; --muted-dark:#6E6E68; --border-dark:#3A3A38;
        --lime-ring:rgba(215,255,0,.35); --placeholder:#6E6E68;
        --shadow:0 1px 2px rgba(0,0,0,.4);
        color-scheme: dark;
      }
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:var(--font-body);font-size:15px;line-height:1.6;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    input{font:inherit}
    ::selection{background:var(--lime);color:var(--dark)}
    :focus-visible{outline:2px solid var(--dark);outline-offset:2px;box-shadow:0 0 0 4px var(--lime-ring)}
    h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.025em;color:var(--text)}
    .container{width:min(calc(100% - (2 * var(--pad))),var(--container));margin-inline:auto}
    .icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .site-header{border-bottom:1px solid var(--border);background:var(--surface)}
    .masthead-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
    .brand{display:inline-flex;align-items:baseline;gap:10px;flex:none}
    .brand-word{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.04em;text-transform:uppercase;color:var(--text)}
    .brand-accent{display:inline-flex;padding:1px 4px;border-radius:2px;background:var(--lime);color:var(--dark)}
    .header-actions{display:flex;align-items:center;gap:8px;flex:none}
    .icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-sm);color:var(--text);transition:background .15s,color .15s}
    .icon-btn:hover{background:var(--lime);color:var(--dark)}
    .header-link{font-size:13px;color:var(--muted);transition:color .15s;padding:8px 10px}
    .header-link:hover{color:var(--text)}
    body{min-height:100vh;display:flex;flex-direction:column}
    .main{flex:1;display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 72px);padding-block:32px}
    .auth-wrap{width:100%;display:flex;justify-content:center;align-items:center}
    .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;width:100%;max-width:460px}
    .auth-head{padding:26px 28px 0}
    .auth-head h2{font-size:22px;line-height:1.15;letter-spacing:-.03em}
    .auth-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .auth-body{display:grid;gap:14px;padding:16px 28px 24px}
    .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{display:grid;gap:6px}
    .field-label{font-size:12px;font-weight:600;color:var(--text)}
    .field-input{width:100%;height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px;transition:border-color .15s,box-shadow .15s}
    .field-input::placeholder{color:var(--placeholder)}
    .field-input:focus{border-color:var(--dark);box-shadow:0 0 0 3px var(--lime-ring);outline:0}
    .check{display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--muted);line-height:1.5}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-sm);font-size:14px;font-weight:600;letter-spacing:-.01em;transition:background-color .15s,border-color .15s,color .15s}
    .btn-primary{background:var(--lime);color:var(--dark)}
    .btn-primary:hover{background:var(--dark);color:var(--lime)}
    .btn-block{width:100%}
    .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn-outline:hover{border-color:var(--lime);color:var(--dark);background:var(--lime)}
    .btn-sm{height:38px;padding:0 14px;font-size:13px}
    .auth-foot{padding:0 28px 26px;text-align:center;font-size:13px;color:var(--muted)}
    .auth-foot a{color:var(--text);font-weight:600}
    .site-header{position:sticky;top:0;z-index:60;background:var(--surface)}
    .masthead{background:var(--surface);border-bottom:1px solid var(--border)}
    .masthead-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
    .header-actions{display:flex;align-items:center;gap:8px;flex:none}
    @media(max-width:560px){
      :root{--pad:16px}
      .masthead-inner{height:64px}
      .main{min-height:calc(100vh - 64px);padding-block:20px;align-items:flex-start}
      .auth-head{padding:22px 18px 0}
      .auth-body{padding:14px 18px 20px}
      .auth-foot{padding:0 18px 22px}
      .grid-2{grid-template-columns:1fr}
      .brand-word{font-size:16px}
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></symbol>
  </svg>
  <script>
  (function(){
    const root=document.documentElement;
    const storage=localStorage.getItem('theme');
    if(storage==='dark'){root.setAttribute('data-theme','dark');}
    else if(storage==='light'){root.setAttribute('data-theme','light');}
  })();
  </script>
  <header class="site-header">
    <div class="masthead">
      <div class="container masthead-inner">
        <a class="brand" href="index.html" aria-label="KOLCH HNA — Accueil">
          <span class="brand-word">KOLCH <span class="brand-accent">HNA</span></span>
        </a>
        <div class="header-actions">
          <a class="btn btn-outline btn-sm" href="login.html">Se connecter</a>
          <a class="btn btn-primary btn-sm" href="signup.html">S'inscrire</a>
        </div>
      </div>
    </div>
  </header>
  <main class="main">
    <div class="container auth-wrap">
      <section class="auth-card">
        <div class="auth-head">
          <h2>Créer un compte</h2>
          <p>C'est rapide et gratuit</p>
        </div>
        <form class="auth-body">
          <div class="grid-2">
            <div class="field">
              <label class="field-label" for="first-name">Prénom</label>
              <input class="field-input" id="first-name" name="first-name" type="text" placeholder="Votre prénom" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label class="field-label" for="last-name">Nom</label>
              <input class="field-input" id="last-name" name="last-name" type="text" placeholder="Votre nom" autocomplete="family-name" required>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="email">Email ou numéro de téléphone</label>
            <input class="field-input" id="email" name="email" type="text" placeholder="exemple@domaine.com ou 0555..." autocomplete="email" required>
          </div>
          <div class="field">
            <label class="field-label" for="password">Mot de passe</label>
            <input class="field-input" id="password" name="password" type="password" placeholder="Minimum 8 caractères" autocomplete="new-password" minlength="8" required>
          </div>
          <label class="check">
            <input type="checkbox" required>
            <span>J'accepte les <a href="#" style="text-decoration:underline">Conditions d'utilisation</a> et la <a href="#" style="text-decoration:underline">Politique de confidentialité</a></span>
          </label>
          <button class="btn btn-primary btn-block" type="submit">Créer mon compte</button>
          <div class="divider">ou</div>
          <button class="btn btn-outline btn-block" type="button">Continuer avec Google</button>
        </form>
        <div class="auth-foot">
          Déjà un compte ? <a href="login.html">Se connecter</a>
        </div>
      </section>
    </div>
  </main>
  <script>
  (function(){
    const root=document.documentElement;
    function getDark(){
      const t=root.getAttribute('data-theme');
      if(t==='dark') return true;
      if(t==='light') return false;
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function updateUI(){
      const btn=document.getElementById('theme-toggle');
      const sun=document.getElementById('theme-icon-sun');
      const moon=document.getElementById('theme-icon-moon');
      const dark=getDark();
      if(btn) btn.setAttribute('aria-pressed',dark?'true':'false');
      if(sun) sun.style.display=dark?'none':'block';
      if(moon) moon.style.display=dark?'block':'none';
    }
    function init(){
      updateUI();
      document.addEventListener('click',function(e){
        const btn=e.target.closest('#theme-toggle');
        if(!btn) return;
        const dark=getDark();
        if(dark){root.setAttribute('data-theme','light');localStorage.setItem('theme','light');}
        else{root.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');}
        updateUI();
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
  })();
  </script>
</body>
</html>
