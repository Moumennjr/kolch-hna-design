<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Connexion | KOLCH HNA</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FFFFFF; --surface:#FFFFFF; --text:#191919; --muted:#737373;
      --border:#E7E7E2; --dark:#111111; --lime:#D7FF00;
      --r-xs:4px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px;
      --container:420px;
      --font-display:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
      --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    :focus-visible{outline:2px solid var(--dark);outline-offset:2px;box-shadow:0 0 0 4px rgba(215,255,0,.45)}
    h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.025em}
    .container{width:min(calc(100% - 32px),var(--container));margin-inline:auto}
    .card{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--surface);overflow:hidden;box-shadow:0 1px 2px rgba(25,25,25,.04)}
    .card-head{padding:26px 28px 0}
    .card-body{display:grid;gap:14px;padding:18px 28px 28px}
    .brand{display:inline-flex;align-items:baseline;gap:10px;margin-bottom:10px}
    .brand-word{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.04em;text-transform:uppercase}
    .brand-accent{display:inline-flex;padding:1px 4px;border-radius:2px;background:var(--lime);color:var(--dark)}
    .field{display:grid;gap:6px}
    .field-label{font-size:12px;font-weight:600}
    .field-input{height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px}
    .field-input:focus{border-color:var(--dark);box-shadow:0 0 0 3px rgba(215,255,0,.45);outline:0}
    .btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:var(--r-sm);font-size:14px;font-weight:600}
    .btn-primary{background:var(--lime);color:var(--dark)}
    .btn-primary:hover{background:var(--dark);color:var(--lime)}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-head">
        <a class="brand" href="../index.html">
          <span class="brand-word">KOLCH <span class="brand-accent">HNA</span></span>
        </a>
        <h1 style="font-size:22px">Connexion Administrateur</h1>
        <p style="margin:6px 0 0;color:var(--muted);font-size:13px">Accès réservé à l'administration</p>
      </div>
      <form class="card-body" action="index.html">
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input class="field-input" id="email" type="email" placeholder="admin@kolchhna.dz">
        </div>
        <div class="field">
          <label class="field-label" for="password">Mot de passe</label>
          <input class="field-input" id="password" type="password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" type="submit">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
