<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commande — KOLCH HNA</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FFFFFF; --surface:#FFFFFF; --text:#191919; --muted:#737373;
      --border:#E7E7E2; --dark:#111111; --lime:#D7FF00; --subtle:#F0F0EC; --warm:#F7F7F4;
      --muted-strong:#66665F;
      --lime-ring:rgba(215,255,0,.45);
      --r-xs:4px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px;
      --shadow:0 1px 2px rgba(25,25,25,.04);
      --container:1120px;
      --font-display:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
      --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
      color-scheme: light;
    }
    [data-theme="dark"]{
      --bg:#0F0F0E; --surface:#151513; --text:#F5F5F4; --muted:#A1A1A0;
      --border:#2A2A28; --dark:#111111; --lime:#D7FF00; --subtle:#1F1F1D; --warm:#1A1A18;
      --muted-strong:#B9B9B4;
      --lime-ring:rgba(215,255,0,.35);
      --shadow:0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#0F0F0E; --surface:#151513; --text:#F5F5F4; --muted:#A1A1A0;
        --border:#2A2A28; --dark:#111111; --lime:#D7FF00; --subtle:#1F1F1D; --warm:#1A1A18;
        --muted-strong:#B9B9B4;
        --lime-ring:rgba(215,255,0,.35);
        --shadow:0 1px 2px rgba(0,0,0,.4);
        color-scheme: dark;
      }
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    input,select{font:inherit}
    :focus-visible{outline:2px solid var(--dark);outline-offset:2px;box-shadow:0 0 0 4px var(--lime-ring)}
    h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.025em}
    .container{width:min(calc(100% - 40px),var(--container));margin-inline:auto}
    .site-header{position:sticky;top:0;z-index:60;background:var(--surface)}
    .masthead{background:var(--surface);border-bottom:1px solid var(--border)}
    .masthead-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
    .brand{display:inline-flex;align-items:baseline;gap:10px}
    .brand-word{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.04em;text-transform:uppercase}
    .brand-accent{display:inline-flex;padding:1px 4px;border-radius:2px;background:var(--lime);color:var(--dark)}
    .header-actions{display:flex;align-items:center;gap:8px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-sm);font-size:14px;font-weight:600}
    .btn-sm{height:38px;padding:0 14px;font-size:13px}
    .btn-primary{background:var(--lime);color:var(--dark)}
    .btn-primary:hover{background:var(--dark);color:var(--lime)}
    .btn-outline{background:transparent;border:1px solid var(--border)}
    .btn-outline:hover{border-color:var(--lime);color:var(--dark);background:var(--lime)}
    .breadcrumb{display:flex;align-items:center;gap:8px;padding-top:18px;font-size:13px;color:var(--muted)}
    .breadcrumb a:hover{color:var(--text)}
    .breadcrumb-sep{color:#C9C9C4}
    .page-head{padding-block:14px 18px}
    .page-title{font-size:clamp(1.6rem,1.2rem + 2vw,2.6rem);letter-spacing:-.045em}
    .checkout-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;padding-bottom:64px}
    .panel{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--surface);overflow:hidden}
    .panel-head{padding:16px 18px;border-bottom:1px solid var(--border)}
    .panel-head h2{font-size:18px}
    .panel-body{display:grid;gap:14px;padding:16px 18px}
    .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{display:grid;gap:6px}
    .field-label{font-size:12px;font-weight:600}
    .field-input{height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px}
    .field-input:focus{border-color:var(--dark);box-shadow:0 0 0 3px var(--lime-ring);outline:0}
    .radio-group{display:grid;gap:10px}
    .radio-item{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px}
    .radio-item.is-active{border-color:var(--lime);background:var(--warm)}
    .summary{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--surface);padding:18px;display:grid;gap:12px;position:sticky;top:92px}
    .summary-row{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}
    .summary-row.total{padding-top:10px;border-top:1px solid var(--border);font-weight:600;color:var(--text);font-size:15px}
    .summary-item{display:flex;align-items:center;gap:12px}
    .summary-item-media{width:56px;height:56px;border-radius:var(--r-md);overflow:hidden;background:var(--subtle)}
    .summary-item-media img{width:100%;height:100%;object-fit:cover}
    .summary-item-info{display:grid;gap:2px}
    .summary-item-title{font-size:13px;font-weight:600}
    .summary-item-meta{font-size:12px;color:var(--muted)}
    .summary .btn{width:100%}
    @media(max-width:980px){
      .checkout-layout{grid-template-columns:1fr}
      .summary{position:static}
    }
    @media(max-width:640px){
      .container{width:min(calc(100% - 24px),var(--container))}
      .masthead-inner{height:64px}
      .grid-2{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <div class="container masthead-inner">
        <a class="brand" href="index.html">
          <span class="brand-word">KOLCH <span class="brand-accent">HNA</span></span>
        </a>
        <div class="header-actions">
          <a class="btn btn-outline btn-sm" href="cart.html">Retour au panier</a>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="container">
      <nav class="breadcrumb">
        <a href="index.html">Accueil</a>
        <span class="breadcrumb-sep">/</span>
        <a href="cart.html">Panier</a>
        <span class="breadcrumb-sep">/</span>
        <span>Commande</span>
      </nav>
      <div class="page-head">
        <h1 class="page-title">Finaliser ma commande</h1>
      </div>
      <div class="checkout-layout">
        <div style="display:grid;gap:16px">
          <section class="panel">
            <div class="panel-head">
              <h2>Informations de livraison</h2>
            </div>
            <div class="panel-body">
              <div class="grid-2">
                <div class="field">
                  <label class="field-label" for="first-name">Prénom</label>
                  <input class="field-input" id="first-name" type="text" placeholder="Votre prénom">
                </div>
                <div class="field">
                  <label class="field-label" for="last-name">Nom</label>
                  <input class="field-input" id="last-name" type="text" placeholder="Votre nom">
                </div>
              </div>
              <div class="grid-2">
                <div class="field">
                  <label class="field-label" for="phone">Téléphone</label>
                  <input class="field-input" id="phone" type="tel" placeholder="0555...">
                </div>
                <div class="field">
                  <label class="field-label" for="wilaya">Wilaya</label>
                  <select class="field-input" id="wilaya">
                    <option>Alger</option>
                    <option>Oran</option>
                    <option>Blida</option>
                    <option>Béjaïa</option>
                    <option>Constantine</option>
                  </select>
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="address">Adresse complète</label>
                <input class="field-input" id="address" type="text" placeholder="Rue, quartier, commune">
              </div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-head">
              <h2>Mode de paiement</h2>
            </div>
            <div class="panel-body">
              <div class="radio-group">
                <label class="radio-item is-active">
                  <input type="radio" name="payment" checked style="accent-color:var(--lime)">
                  <div>
                    <strong>Paiement à la livraison</strong>
                    <div style="font-size:13px;color:var(--muted)">Payez en espèces à la réception</div>
                  </div>
                </label>
                <label class="radio-item">
                  <input type="radio" name="payment" style="accent-color:var(--lime)">
                  <div>
                    <strong>Paiement en ligne</strong>
                    <div style="font-size:13px;color:var(--muted)">Carte bancaire / CIB</div>
                  </div>
                </label>
              </div>
            </div>
          </section>
        </div>
        <aside class="summary">
          <h2 style="font-size:18px">Commande</h2>
          <div style="display:grid;gap:10px">
            <div class="summary-item">
              <div class="summary-item-media">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=400&auto=format&fit=crop" alt="Smartphone">
              </div>
              <div class="summary-item-info">
                <span class="summary-item-title">Smartphone 5G 128GB</span>
                <span class="summary-item-meta">1 x 34 900 DZD</span>
              </div>
            </div>
            <div class="summary-item">
              <div class="summary-item-media">
                <img src="https://images.unsplash.com/photo-1520923642038-b4259acecbd7?q=80&w=400&auto=format&fit=crop" alt="Écouteurs">
              </div>
              <div class="summary-item-info">
                <span class="summary-item-title">Écouteurs sans fil Bluetooth</span>
                <span class="summary-item-meta">1 x 6 900 DZD</span>
              </div>
            </div>
          </div>
          <div class="summary-row">
            <span>Sous-total</span>
            <span>41 800 DZD</span>
          </div>
          <div class="summary-row">
            <span>Livraison</span>
            <span>0 DZD</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span>41 800 DZD</span>
          </div>
          <button class="btn btn-primary">Confirmer la commande</button>
        </aside>
      </div>
    </div>
  </main>
</body>
</html>
